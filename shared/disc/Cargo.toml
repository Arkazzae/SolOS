[package]
name = "disc"
version = "0.1.0"
edition = "2024"
description = "Disc images for Sol OS's disc-based cores: CD images (CHD) as raw sectors, GameCube discs (ISO, RVZ) by offset"
license = "MIT"
publish = false

[dependencies]
chd = "0.4"
# Deflate, for a PlayStation disc in an EBOOT.PBP.
miniz_oxide = "0.9"
# zstd for RVZ, pure Rust; the same crate chd decompresses with.
zrip = { version = "0.8.11", default-features = false, features = ["frame"] }
